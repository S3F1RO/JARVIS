[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sulyvan", email = "sulyvanpapaya.pro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.2.0",
    "openai>=3.8.0",
    "openai-agents>=0.22.0",
    "psycopg2>=2.9.12",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
